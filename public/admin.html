<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MM GAME STORE Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090d20;color:#fff;font-family:Arial,sans-serif}
main{max-width:650px;margin:25px auto;padding:14px}
.card{background:#151d38;border:1px solid #454071;border-radius:14px;padding:18px;margin:14px 0}
h2{color:#c5adff}h3{color:#d8ccff}
input,select,button{width:100%;padding:12px;margin:6px 0;border-radius:8px}
input,select{background:#0c1430;color:white;border:1px solid #555}
button{background:#7048df;color:white;border:0;font-weight:bold}
button.secondary{background:#394665}button.danger{background:#a83b55}
.item{border-top:1px solid #454071;padding:12px 0}
a{color:#c5adff}small{color:#b9bfd5}#msg{color:#ffaaaa}
.hidden{display:none}.row{display:flex;gap:8px}.row button{width:auto;flex:1}
</style>
</head>
<body>
<main>
<section class="card" id="loginBox">
<h2>MM GAME STORE</h2><h3>Admin Login</h3>
<form id="login">
<input name="username" value="Amiga" placeholder="Username" required>
<input name="password" type="password" placeholder="Password" required>
<button>LOGIN</button>
</form><p id="msg"></p>
</section>
<div id="panel" class="hidden">
<div class="card">
<h2>Admin Dashboard</h2>
<button class="secondary" onclick="loadAll()">Refresh</button>
<button class="danger" onclick="logout()">Logout</button>
</div>
<section class="card">
<h3>Game အသစ်ထည့်ရန်</h3>
<form id="gameForm">
<input name="name" placeholder="Game အမည်" required>
<button>Game ထည့်မည်</button>
</form>
<div id="games"></div>
</section>
<section class="card">
<h3>Package အသစ်ထည့်ရန်</h3>
<form id="packageForm">
<select name="gameId" id="gameSelect" required></select>
<input name="title" placeholder="ဥပမာ - 86 Diamonds" required>
<input name="price" type="number" min="1" placeholder="ဈေးနှုန်း (MMK)" required>
<button>Package ထည့်မည်</button>
</form>
<div id="packages"></div>
</section>
<section class="card">
<h3>Customer Orders</h3>
<div id="orders">Loading...</div>
</section>
</div>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,options={}){
const r=await fetch(url,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});
let d={};try{d=await r.json()}catch{}
if(!r.ok)throw Error(d.error||'လုပ်ဆောင်မှု မအောင်မြင်ပါ');
return d;
}
async function loadAll(){
try{
const [c,o]=await Promise.all([api('/api/admin/catalog'),api('/api/admin/orders')]);
$('games').innerHTML=c.games.map(g=>`<div class="item"><b>${esc(g.name)}</b> <small>#${g.id}</small><p>${g.active?'ဖွင့်ထားသည်':'ပိတ်ထားသည်'}</p><button class="secondary" onclick="toggleGame(${g.id},${!g.active})">${g.active?'ပိတ်မည်':'ပြန်ဖွင့်မည်'}</button></div>`).join('')||'Game မရှိပါ';
$('gameSelect').innerHTML=c.games.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('');
$('packages').innerHTML=c.packages.map(p=>`<div class="item"><b>${esc(p.title)}</b> — ${Number(p.price).toLocaleString()} MMK<br><small>Game ID: ${p.game_id} | Package ID: ${p.id} | ${p.active?'ဖွင့်ထားသည်':'ပိတ်ထားသည်'}</small><div class="row"><button onclick="editPackage(${p.id},'${esc(p.title).replace(/'/g,"&#39;")}',${p.price})">အမည်/ဈေးပြင်</button><button class="secondary" onclick="togglePackage(${p.id},${!p.active})">${p.active?'ပိတ်မည်':'ပြန်ဖွင့်မည်'}</button></div></div>`).join('')||'Package မရှိပါ';
$('orders').innerHTML=o.length?o.map(x=>`<div class="item"><b>Order #${x.id}</b><p>${esc(x.game_name)} — ${esc(x.package_name)}</p><p>Player ID: ${esc(x.player_id)}</p><p>${esc(x.contact)} | ${esc(x.payment)}</p><p>${Number(x.price).toLocaleString()} MMK | ${esc(x.status)}</p>${x.proof_file?`<p><a href="/uploads/${encodeURIComponent(x.proof_file)}" target="_blank">ငွေလွှဲ Screenshot ကြည့်ရန်</a></p>`:'<small>Screenshot မတင်ထားပါ</small>'}<select onchange="updateStatus(${x.id},this.value)"><option ${x.status==='Pending'?'selected':''}>Pending</option><option ${x.status==='Approved'?'selected':''}>Approved</option><option ${x.status==='Rejected'?'selected':''}>Rejected</option><option ${x.status==='Completed'?'selected':''}>Completed</option></select></div>`).join(''):'<p>အော်ဒါမရှိသေးပါ။</p>';
}catch(e){$('msg').textContent=e.message}
}
async function toggleGame(id,active){try{await api('/api/admin/games/'+id,{method:'PATCH',body:JSON.stringify({active})});await loadAll()}catch(e){alert(e.message)}}
async function togglePackage(id,active){try{await api('/api/admin/packages/'+id,{method:'PATCH',body:JSON.stringify({active})});await loadAll()}catch(e){alert(e.message)}}
async function editPackage(id,title,price){
const t=prompt('Package အမည်',title);if(t===null)return;
const p=prompt('ဈေးနှုန်း (MMK)',price);if(p===null)return;
try{await api('/api/admin/packages/'+id+'/details',{method:'PATCH',body:JSON.stringify({title:t,price:p})});alert('ဈေးနှုန်း ပြင်ပြီးပါပြီ');await loadAll()}catch(e){alert(e.message)}
}
async function updateStatus(id,status){try{await api('/api/admin/orders/'+id,{method:'PATCH',body:JSON.stringify({status})});await loadAll()}catch(e){alert(e.message)}}
$('login').onsubmit=async e=>{
e.preventDefault();$('msg').textContent='စစ်ဆေးနေသည်...';
try{await api('/api/admin/login',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});$('loginBox').classList.add('hidden');$('panel').classList.remove('hidden');$('msg').textContent='';await loadAll()}catch(err){$('msg').textContent=err.message}
};
$('gameForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/admin/games',{method:'POST',body:JSON.stringify({name:new FormData(e.target).get('name')})});e.target.reset();alert('Game ထည့်ပြီးပါပြီ');await loadAll()}catch(err){alert(err.message)}};
$('packageForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/admin/packages',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});e.target.reset();alert('Package ထည့်ပြီးပါပြီ');await loadAll()}catch(err){alert(err.message)}};
async function logout(){try{await api('/api/admin/logout',{method:'POST'});location.reload()}catch(e){alert(e.message)}}
api('/api/admin/me').then(d=>{if(d.loggedIn){$('loginBox').classList.add('hidden');$('panel').classList.remove('hidden');loadAll()}});
</script>
</body>
</html>
